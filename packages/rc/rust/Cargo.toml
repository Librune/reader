[package]
name = "rc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
boa_engine = { version="0.20.0",features=["annex-b"]}
flutter_rust_bridge = "=2.7.1"
bytemuck = "1.14.0"
tokio = { version = "1.43.0", features = ["time"] }
reqwest = { version = "0.12.12", features = ["json", "blocking", "rustls-tls"], default-features = false}
anyhow = "1.0.95"
boa_runtime = "0.20.0"
futures-util = "0.3.31"
scraper = "0.22.0"
once_cell = "1.20.3"
serde = "1.0.217"
serde_json = "1.0.138"
sha2 = "0.10.8"
base64 = "0.22.1"
hex = "0.4.3"
uuid = {version="1.13.1",features=["v4","fast-rng","macro-diagnostics"]}
lazy_static = "1.5.0"
aes-gcm = "0.10.3"
cbc = "0.1.2"
aes = "0.8.4"
md5 = "0.7.0"
hmac = "0.12.1"
quickxml_to_serde = { git = "https://github.com/zsakvo/quickxml_to_serde", features = ["json_types"] }
encoding_rs = "0.8.35"
percent-encoding = "2.3.1"
regex = "1.11.1"
chardet = "0.2.4"
boa_gc = "0.20.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
