[package]
name = "rc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.7.1"
book_core = { git = "https://github.com/Librune/core"}
boa_engine = { version="0.20.0",features=["annex-b"]}
boa_runtime = "0.20.0"
boa_gc = "0.20.0"
serde = "1.0.217"
serde_json = "1.0.138"



[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 'z'
lto = true
panic = 'abort'
codegen-units = 1